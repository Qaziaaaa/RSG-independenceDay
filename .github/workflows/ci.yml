name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if no backend
        id: has-backend
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.has-backend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.has-backend.outputs.present == 'true'
        run: npm ci

      - name: Syntax check all JS files
        if: steps.has-backend.outputs.present == 'true'
        run: |
          failed=0
          while IFS= read -r file; do
            if ! node --check "$file"; then
              echo "SYNTAX ERROR in: $file"
              failed=1
            fi
          done < <(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*')
          exit $failed

  backend-boot:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if no backend
        id: has-backend
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.has-backend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.has-backend.outputs.present == 'true'
        run: npm ci

      - name: Seed and boot server, hit health endpoint
        if: steps.has-backend.outputs.present == 'true'
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/bootcamp_lms_ci
          JWT_SECRET: ci_test_secret
          NODE_ENV: development
        run: |
          npm run seed
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Health check passed"
              curl -sf http://localhost:5000/api/health
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to respond within 20s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if no frontend
        id: has-frontend
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.has-frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.has-frontend.outputs.present == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        if: steps.has-frontend.outputs.present == 'true'
        working-directory: ./frontend
        run: npm run build
